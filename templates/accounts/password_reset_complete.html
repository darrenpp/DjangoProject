{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password Reset Complete - {{ system_title }}</title>
  <link rel="stylesheet" href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'vendor/fontawesome/css/all.min.css' %}">
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(180deg, #f7f7f4 0%, #edf1ee 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }
    .card-shell {
      max-width: 700px;
      width: 100%;
      border-radius: 28px;
      border: 1px solid #d7dfdb;
      box-shadow: 0 24px 60px rgba(14, 32, 49, .10);
    }
  </style>
  <link rel="stylesheet" href="{% static 'css/government-enterprise.css' %}">
</head>
<body>
  {% include 'includes/page_section_navigation.html' %}
  <div class="card card-shell">
    <div class="card-body p-5 text-center">
      <img src="{% static 'img/NDOH_LOGO.png' %}" alt="Papua New Guinea crest" style="max-height: 88px; margin-bottom: 14px;">
      <h1 class="h3 mb-3">Password Updated</h1>
      <p class="text-muted mb-4">
        Your password has been reset successfully. You can now sign in with your new password.
      </p>
      <a href="{% url 'login' %}" class="btn btn-primary me-2">Applicant Sign In</a>
      <a href="{% url 'staff_login' %}" class="btn btn-outline-secondary">Staff Sign In</a>
    </div>
  </div>
  <script src="{% static 'js/page-section-navigation.js' %}?v=20260515-section-nav-1"></script>
</body>
</html>
